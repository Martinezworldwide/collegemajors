, {"module_title": "Integration", "lessons": ["Antiderivatives", "The Definite Integral", "Fundamental Theorem of Calculus", "Integration by Substitution", "Applications of Integration (Area)"]}], "assessments": {"quizzes": 4, "midterm": true, "final": true, "project": false}, "mastery_rubric": "To pass, students must demonstrate proficiency in calculating limits, derivatives, and basic integrals. A strong understanding of the Fundamental Theorem of Calculus and applications of derivatives (e.g., optimization) is required. Final course grade must be 70% or higher, with at least 60% on the final exam.", "source": "MathUniversity (full course, built)"}, "MATH102": {"modules": [{"module_title": "Techniques of Integration", "lessons": ["Integration by Parts", "Trigonometric Integrals", "Trigonometric Substitution", "Partial Fractions", "Improper Integrals"]}, {"module_title": "Applications of Integration", "lessons": ["Area Between Curves", "Volumes by Disks/Washers", "Volumes by Cylindrical Shells", "Arc Length", "Surface Area of Revolution"]}, {"module_title": "Sequences and Series", "lessons": ["Sequences", "Series and Convergence", "Integral Test and P-Series", "Comparison Tests", "Alternating Series Test", "Ratio and Root Tests", "Power Series", "Taylor and Maclaurin Series"]}, {"module_title": "Parametric Equations and Polar Coordinates", "lessons": ["Parametric Curves", "Calculus with Parametric Curves", "Polar Coordinates", "Area and Arc Length in Polar Coordinates"]}], "assessments": {"quizzes": 4, "midterm": true, "final": true, "project": false}, "mastery_rubric": "To pass, students must master various integration techniques and their applications, especially in calculating volumes and arc lengths. A solid grasp of convergence tests for sequences and series, and the ability to work with power, Taylor, and Maclaurin series, is essential. Final course grade must be 70% or higher, with at least 60% on the final exam.", "source": "MathUniversity (full course, bui "]}, {"module_title": "First-Order Differential Equations", "lessons": ["Solution Curves", "Separable Equations", "Linear Equations", "Exact Equations", "Homogeneous Equations", "Applications of First-Order Equations"]}, {"module_title": "Higher-Order Differential Equations", "lessons": ["Preliminary Theory: Linear Equations", "Reduction of Order", "Homogeneous Linear Equations with Constant Coefficients", "Undetermined Coefficients (Superposition Approach)", "Variation of Parameters", "Cauchy-Euler Equation"]}, {"module_title": "Laplace Transform", "lessons": ["Definition of the Laplace Transform", "Inverse Transforms", "Operational Properties I & II", "Dirac Delta Function", "Systems of Linear Differential Equations"]}, {"module_title": "Series Solutions of Linear Equations", "lessons": ["Review of Power Series", "Series Solutions about Ordinary Points", "Series Solutions about Singular Points"]}, {"module_title": "Systems of Linear First-Order Differential Equations", "lessons": ["Linear Systems", "Homogeneous Linear Systems", "Nonhomogeneous Linear Systems", "Matrix Exponential"]}], "assessments": {"quizzes": 6, "midterm": true, "final": true, "project": false}, "mastery_rubric": "To pass, students must be able to solve various types of first- and second-order differential equations, apply Laplace transforms, and find series solutions. A clear understanding of modeling real-world phenomena with differential equations is crucial. Final course grade must be 70% or higher, with at least 60% on the final exam.", "source": "MathUniversity (full course, built)"}, "MATH203": {"modules": [{"module_title": "Systems of Linear Equations and Matrices", "lessons": ["Introduction to Systems of Linear Equations", "Gaussian Elimination", "Matrices and Matrix Operations", "Inverses; Rules of Matrix Arithmetic", "Elementary Matrices and a Method for Finding A\u207b\u00b9"]}, {"module_title": "Determinants", "lessons": ["The Determinant Function", "Evaluating Determinants by Row Reduction", "Properties of the Determinant Function", "Cramer's Rule"]}, {"module_title": "Vector Spaces", "lessons": ["Real Vector Spaces", "Subspaces", "Spanning Sets and Linear Independence", "Basis and Dimension", "Row Space, Column Space, and Null Space"]}, {"module_title": "Linear Transformations", "lessons": ["General Linear Transformations", "Kernels and Ranges", "Inverse Linear Transformations", "Matrices of General Linear Transformations", "Similarity"]}, {"module_title": "Eigenvalues and Eigenvectors", "lessons": ["Eigenvalues and Eigenvectors", "Diagonalization", "Orthogonal Diagonalization"]}, {"module_title": "Inner Product Spaces", "lessons": ["Inner Products", "Gram-Schmidt Process", "Orthogonal Matrices"]}], "assessments": {"quizzes": 6, "midterm": true, "final": true, "project": false}, "mastery_rubric": "To pass, students must demonstrate strong computational skills in solving linear systems, matrix operations, and finding determinants. A conceptual understanding of vector spaces, linear transformations, eigenvalues, and eigenvectors is crucial. Final course grade must be 70% or higher, with at least 60% on the final exam.", "source": "MathUniversity (full course, built)"}, "MATH204": {"modules": [{"module_title": "Logic and Proofs", "lessons": ["Propositional Logic", "Predicate Logic", "Proof Methods"]}, {"module_title": "Set Theory and Functions", "lessons": ["Sets and Operations", "Functions", "Cardinality"]}, {"module_title": "Combinatorics", "lessons": ["Counting Principles", "Permutations and Combinations", "Binomial Theorem"]}, {"module_title": "Graph Theory", "lessons": ["Graphs and Models", "Graph Terminology", "Connectivity", "Euler and Hamilton Paths"]}, {"module_title": "Algorithms", "lessons": ["Introduction to Algorithms", "Algorithm Efficiency", "Searching and Sorting Algorithms"]}], "assessments": {"quizzes": 5, "midterm": true, "final": true, "project": false}, "mastery_rubric": "To pass, students must demonstrate a clear understan cant figures. Final grade 70% or higher.", "source": "Martinez original syllabus (authored 2026-11-14)"}};
const sel=document.getElementById('major');
Object.keys(CUR).forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=CUR[k].major;sel.appendChild(o)});
function key(k,c){return 'mu:'+k+':'+c}
function render(){
  const k=sel.value, plan=CUR[k]; let done=0,total=0;
  let h='<div class="card"><h2>'+plan.major+'</h2><p>'+plan.degree+' · '+plan.category+'</p></div>';
  plan.semesters.forEach(s=>{
    h+='<div class="card"><h3>Semester '+s.semester+' — '+s.credits+' credits</h3>';
    s.courses.forEach(cid=>{const c=LIB[cid]; total++;
      const checked=localStorage.getItem(key(k,cid))==='1'; if(checked)done++;
      const res=c.free_resources.map(r=>'<a href="'+r.url+'" target="_blank" rel="noopener">'+r.provider+'</a>').join(' · ');
      const tb=c.textbook.type==='martinez-original'?'<span class="badge orig">Martinez Bookstore original — queued</span>':'<span class="badge">Open textbook</span>';
      const ct=CONTENT[cid];
      let detail='';
      if(ct){
        detail='<details><summary>Open course content — '+ct.modules.length+' modules</summary>';
        ct.modules.forEach((m,mi)=>{ detail+='<div style="margin:8px 0"><strong>Module '+(mi+1)+': '+m.module_title+'</strong><ul>'
          + m.lessons.map(l=>'<li>'+l+'</li>').join('') + '</ul></div>'; });
        const a=ct.assessments||{};
        detail+='<small>Assessments: '+(a.quizzes||0)+' quizzes'+(a.midterm?' · midterm':'')+(a.final?' · final':'')+(a.project?' · project':'')
          + (ct.mastery_rubric?'<br>Mastery: '+ct.mastery_rubric:'') + '<br>Source: '+ct.source+'</small></details>';
      } else {
        detail='<small><em>Full lessons in the production queue — the daily batches now build content course by course. Free full-course resources linked above in the meantime.</em></small>';
      }
      h+='<div class="course"><input type="checkbox" data-m="'+k+'" data-c="'+cid+'" '+(checked?'checked':'')+'>'
        +'<div><strong>'+cid+' — '+c.title+'</strong> <span class="badge">'+c.credit_hours+' cr</span> '+tb
        +'<small>Free: '+res+'</small>'+detail+'</div></div>';
    }); h+='</div>';
  });
  document.getElementById('plan').innerHTML=h;
  document.getElementById('prog').innerHTML='<div class="card"><strong>'+done+' / '+total+' courses complete</strong><progress max="'+total+'" value="'+done+'"></progress></div>';
  document.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',e=>{
    localStorage.setItem(key(e.target.dataset.m,e.target.dataset.c), e.target.checked?'1':'0'); render();
  }));
}
sel.addEventListener('change',render); render();
</script></body></html>
